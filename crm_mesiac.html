<style>
/* Layout: nav · header s ovládaním · súhrnné dlaždice · tímový denný graf · tabuľka predajcov · karta na predajcu (lievik + denný graf + zoznam OP) */
:root{
  --bg:#f3f4f6; --surface:#ffffff; --surface-2:#f7f8fa; --line:#e1e4ea; --line-2:#ccd1da;
  --ink:#10141c; --ink-2:#4a5262; --ink-3:#7a8293;
  --accent:#2a78d6; --accent-soft:#e3eefb;
  --good:#0a8a0a; --good-soft:#e2f4e2; --bad:#d03b3b; --bad-soft:#fbe6e6; --warn:#b77900; --warn-soft:#fdf1d8;
  --c-new:#7a8293; --c-po:#86b6ef; --c-ob:#1c5cab; --c-w:#0a8a0a; --wkend:rgba(16,20,28,.045);
  --f:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0f1115; --surface:#181b21; --surface-2:#1f232b; --line:#2b303a; --line-2:#3a404c;
  --ink:#f2f4f7; --ink-2:#b4bac6; --ink-3:#8a91a0; --accent:#5598e7; --accent-soft:#1b2a40;
  --good:#3cc23c; --good-soft:#15291a; --bad:#ec6a6a; --bad-soft:#341b1d; --warn:#f0b43a; --warn-soft:#33290f;
  --c-new:#8a91a0; --c-po:#256abf; --c-ob:#8cbcf2; --c-w:#3cc23c; --wkend:rgba(255,255,255,.04);}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0f1115; --surface:#181b21; --surface-2:#1f232b; --line:#2b303a; --line-2:#3a404c;
  --ink:#f2f4f7; --ink-2:#b4bac6; --ink-3:#8a91a0; --accent:#5598e7; --accent-soft:#1b2a40;
  --good:#3cc23c; --good-soft:#15291a; --bad:#ec6a6a; --bad-soft:#341b1d; --warn:#f0b43a; --warn-soft:#33290f;
  --c-new:#8a91a0; --c-po:#256abf; --c-ob:#8cbcf2; --c-w:#3cc23c; --wkend:rgba(255,255,255,.04);}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:14px;line-height:1.45}
.wrap{max-width:1320px;margin:0 auto;padding-inline:20px;padding-block:20px 48px;display:flex;flex-direction:column;gap:18px}
@media (max-width:640px){.wrap{padding-inline:16px}}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
h1{font-size:24px;font-weight:800;letter-spacing:-.01em;margin:0;text-wrap:balance}
h2{font-size:16px;font-weight:700;margin:0}
h3{font-size:15px;font-weight:700;margin:0}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:600}
.sub{color:var(--ink-2);font-size:13px;max-width:90ch}
.xnav{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;font-size:13px}
.xnav a{color:var(--accent);text-decoration:none;font-weight:600}.xnav a:hover{text-decoration:underline}
.xnav .cur{font-weight:700;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
header.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.ctl{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;font:600 12.5px var(--f);color:var(--ink-2);padding:6px 11px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
select{font:500 13px var(--f);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
label.c{display:flex;align-items:center;gap:6px;color:var(--ink-2);font-size:12.5px}
button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible,tr:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tile .lab{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:600;display:flex;align-items:center;gap:6px}
.tile .val{font-family:var(--mono);font-size:24px;font-weight:600;line-height:1.1}
.tile .s{font-size:12px;color:var(--ink-2)}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.sw.ln{height:2px;border-radius:0;width:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0;display:flex;flex-direction:column;gap:12px}
.hd{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px 16px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.chartbox{position:relative;height:300px}
.chartbox.sm{height:190px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:650;background:var(--surface-2)}
td{font-family:var(--mono);font-variant-numeric:tabular-nums}
td.l,th.l{text-align:left;font-family:var(--f)}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--surface-2)}
tfoot td{font-weight:700;background:var(--surface-2);border-bottom:0}
td .z{color:var(--ink-3)}
.reps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:980px){.reps{grid-template-columns:minmax(0,1fr)}}
.rep .nm{font-size:16px;font-weight:750}
.rep .kp{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-flex;align-items:baseline;gap:5px;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:2px 9px;font-size:12px;color:var(--ink-2)}
.pill b{font-family:var(--mono);color:var(--ink);font-weight:600}
.fun{display:flex;flex-direction:column;gap:5px}
.frow{display:grid;grid-template-columns:150px minmax(0,1fr) 92px;gap:10px;align-items:center;font-size:12.5px}
.frow .lb{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ftrack{height:16px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.ftrack i{display:block;height:100%;background:var(--accent);border-radius:4px;min-width:2px}
.frow.lost .ftrack i{background:var(--bad)}
.frow .n{text-align:right;font-family:var(--mono)}
.frow .n small{color:var(--ink-3);font-family:var(--f)}
@media (max-width:520px){.frow{grid-template-columns:110px minmax(0,1fr) 76px}}
details.ops summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:13px}
details.ops .tbl{margin-top:8px;max-height:320px;overflow:auto}
.st{display:inline-block;font-family:var(--f);font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:5px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.st.won{background:var(--good-soft);color:var(--good);border-color:transparent}
.st.lost{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.st.ob{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.note{font-size:12px;color:var(--ink-3);margin:0;max-width:110ch}
.empty{color:var(--ink-3);font-size:13px;padding:10px 0}
</style></head><body>

    <p class="note" id="funNote"></p>
    <div class="reps" id="reps"></div>
  </section>

  <p class="note" id="foot"></p>
</div>

<script>
const D = JSON.parse(document.getElementById('mdata').textContent);
const MON = ['január','február','marec','apríl','máj','jún','júl','august','september','október','november','december'];
const WD = ['Ne','Po','Ut','St','Št','Pi','So'];
const EV = [['n','Nové OP','--c-new'],['po','Ponuky','--c-po'],['ob','Objednávky','--c-ob'],['w','Výhry','--c-w']];
const EVL = {n:'Nové OP',po:'Ponuky zaslané',ak:'Ponuky akceptované',ob:'Objednávky podpísané',fa:'Faktúry uhradené',w:'Výhry',l:'Prehry / zrušené'};
const fmt = n => Math.round(n).toLocaleString('sk-SK');
const eur = n => n >= 1e6 ? (n/1e6).toLocaleString('sk-SK',{maximumFractionDigits:2})+' mil. €' : fmt(n)+' €';
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let st = {ym: D.today.slice(0,7), met:'n', cum:false, fun:'c'};
try { const s = JSON.parse(localStorage.getItem('crmMesiac')||'{}'); if (s.met) st.met = s.met; if (s.fun) st.fun = s.fun; if (typeof s.cum === 'boolean') st.cum = s.cum; } catch(e) {}
const save = () => { try { localStorage.setItem('crmMesiac', JSON.stringify({met:st.met, fun:st.fun, cum:st.cum})); } catch(e) {} };

// months available (last 12)
const months = [...new Set(D.ops.map(o => o.n.slice(0,7)))].sort().reverse().filter(m => m <= D.today.slice(0,7)).slice(0,12);
const mSel = document.getElementById('mSel');
mSel.innerHTML = months.map(m => `<option value="${m}">${MON[+m.slice(5)-1]} ${m.slice(0,4)}</option>`).join('');
mSel.value = st.ym;
document.getElementById('expDate').textContent = D.exported;

const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const charts = [];

function days(ym){
  const [y,m] = ym.split('-').map(Number); const n = new Date(y, m, 0).getDate();
  return Array.from({length:n}, (_,i) => { const d = new Date(y, m-1, i+1); return {iso:`${ym}-${String(i+1).padStart(2,'0')}`, d:i+1, wd:d.getDay()}; });
}
function series(ops, ym, key){
  const ds = days(ym), idx = Object.fromEntries(ds.map((x,i)=>[x.iso,i])), a = new Array(ds.length).fill(0);
  for (const o of ops){ const dt = o[key]; if (dt && dt.slice(0,7) === ym && idx[dt] !== undefined) a[idx[dt]] += st.met === 'v' ? o.v : 1; }
  const lim = ym === D.today.slice(0,7) ? idx[D.today] : a.length-1;
  if (st.cum){ let s = 0; return a.map((x,i) => i > lim ? null : (s += x)); }
  return a.map((x,i) => i > lim ? null : x);
}
const cnt = (ops, ym, key) => ops.reduce((s,o) => s + (o[key] && o[key].slice(0,7) === ym ? (st.met==='v' ? o.v : 1) : 0), 0);
const val = n => st.met === 'v' ? eur(n) : fmt(n);

const weekendPlugin = {id:'wk', beforeDatasetsDraw(c){
  const {ctx, chartArea:a, scales:{x}} = c, ds = c.$days; if (!ds) return;
  ctx.save(); ctx.fillStyle = css('--wkend');
  ds.forEach((d,i) => { if (d.wd === 0 || d.wd === 6){ const w = x.getPixelForValue(1) - x.getPixelForValue(0); ctx.fillRect(x.getPixelForValue(i) - w/2, a.top, w, a.bottom - a.top); } });
  const ti = ds.findIndex(d => d.iso === D.today);
  if (ti >= 0){ const px = x.getPixelForValue(ti); ctx.strokeStyle = css('--ink-3'); ctx.setLineDash([3,3]); ctx.beginPath(); ctx.moveTo(px, a.top); ctx.lineTo(px, a.bottom); ctx.stroke(); }
  ctx.restore(); }};

function mkChart(canvas, ops, ym, small){
  const ds = days(ym);
  const data = {labels: ds.map(d => small ? String(d.d) : [String(d.d), WD[d.wd]]),
    datasets: EV.map(([k,lab,c]) => k === 'n'
      ? {type:'line', label:lab, data:series(ops,ym,k), borderColor:css(c), backgroundColor:css(c), borderWidth:2, pointRadius:small?0:2, pointHoverRadius:4, cubicInterpolationMode:'monotone', spanGaps:false, order:0}
      : {type:'bar', label:lab, data:series(ops,ym,k), backgroundColor:css(c), borderRadius:2, maxBarThickness:small?7:14, order:1})};
  const ch = new Chart(canvas, {data, plugins:[weekendPlugin], options:{responsive:true, maintainAspectRatio:false, animation:false,
    interaction:{mode:'index', intersect:false},
    plugins:{legend:{display:false}, tooltip:{callbacks:{
      title: it => { const d = ds[it[0].dataIndex]; return `${WD[d.wd]} ${d.d}. ${+ym.slice(5)}.`; },
      label: it => ` ${it.dataset.label}: ${val(it.raw ?? 0)}`}}},
    scales:{x:{grid:{display:false}, ticks:{color:css('--ink-3'), font:{family:'Archivo', size:small?9:10}, autoSkip:true, maxRotation:0}},
            y:{beginAtZero:true, grid:{color:css('--line')}, border:{display:false},
               ticks:{color:css('--ink-3'), font:{family:'IBM Plex Mono', size:10}, precision:0, maxTicksLimit:small?4:6,
                      callback: v => st.met === 'v' ? (v >= 1000 ? Math.round(v/1000)+' tis.' : v) : v}}}}});
  ch.$days = ds; charts.push(ch); return ch;
}

function funnel(ops, ym){
  if (st.fun === 'c'){
    const co = ops.filter(o => o.n.slice(0,7) === ym), tot = co.length;
    const W = o => st.met === 'v' ? o.v : 1;
    const sum = f => co.filter(f).reduce((s,o) => s + W(o), 0), base = sum(() => true);
    const rows = [['Zaevidované OP', base], ['Cenová ponuka zaslaná', sum(o => o.rs >= 1)], ['Ponuka akceptovaná', sum(o => o.rs >= 2)],
                  ['Objednávka podpísaná', sum(o => o.rs >= 3)], ['Faktúra / odovzdanie', sum(o => o.rs >= 4)], ['Výhra', sum(o => o.ss === 'won')]];
    const lost = sum(o => o.ss === 'lost' || o.ss === 'canc'), open = sum(o => o.ss === 'open' || o.ss === 'post');
    return {rows, lost:['Prehra / zrušené', lost], extra:`${val(open)} stále otvorených`, base, tot};
  }
  const rows = ['n','po','ak','ob','fa','w'].map(k => [EVL[k], cnt(ops, ym, k)]);
  return {rows, lost:[EVL.l, cnt(ops, ym, 'l')], base: Math.max(...rows.map(r => r[1]), 1), extra:''};
}
function funHtml(F){
  const mx = Math.max(F.base, 1);
  const r = ([lb, n], cls='') => `<div class="frow ${cls}"><span class="lb" title="${esc(lb)}">${esc(lb)}</span><span class="ftrack"><i style="width:${n ? Math.max(2, n/mx*100) : 0}%"></i></span><span class="n">${val(n)}${st.fun==='c' && F.base && cls!=='lost' && lb!=='Zaevidované OP' ? ` <small>${Math.round(n/F.base*100)} %</small>` : ''}</span></div>`;
  return `<div class="fun">${F.rows.map(x => r(x)).join('')}${r(F.lost,'lost')}</div>`;
}
const STL = o => o.ss === 'won' ? ['Výhra','won'] : o.ss === 'lost' ? ['Prehra','lost'] : o.ss === 'canc' ? ['Zrušené','lost'] : o.ss === 'post' ? ['Odložený',''] : [D.stages[Math.min(o.rs,5)], o.rs >= 3 ? 'ob' : ''];
const dm = s => s ? `${+s.slice(8)}. ${+s.slice(5,7)}.` : '—';

function render(){
  charts.splice(0).forEach(c => c.destroy());
  const ym = st.ym, mname = `${MON[+ym.slice(5)-1]} ${ym.slice(0,4)}`, isCur = ym === D.today.slice(0,7);
  document.title = `CRM ${MON[+ym.slice(5)-1]} · Lion Car`;
  document.getElementById('h1').textContent = `CRM ${mname}`;
  document.getElementById('navCur').textContent = `CRM ${MON[+ym.slice(5)-1]}`;
  document.getElementById('scope').textContent = `${D.owners.length} predajcov s aspoň jedným OP Predaj MV za posledných 12 mesiacov${isCur ? ` · stav k ${dm(D.today)}` : ''}`;
  document.querySelectorAll('#metSeg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.m === st.met));
  document.querySelectorAll('#funSeg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.f === st.fun));
  document.getElementById('cum').checked = st.cum;
  const all = D.ops;
  // tiles
  const co = all.filter(o => o.n.slice(0,7) === ym), nCo = co.length;
  const conv = nCo ? Math.round(co.filter(o => o.rs >= 3).length / nCo * 100) : 0;
  const T = [['n','Nové OP','--c-new'],['po','Ponuky zaslané','--c-po'],['ak','Ponuky akceptované',null],['ob','Objednávky','--c-ob'],['w','Výhry','--c-w'],['l','Prehry / zrušené',null]];
  document.getElementById('tiles').innerHTML = T.map(([k,l,c]) => `<div class="tile"><span class="lab">${c ? `<i class="sw${k==='n'?' ln':''}" style="background:var(${c})"></i>` : ''}${l}</span><span class="val">${val(cnt(all,ym,k))}</span></div>`).join('')
    + `<div class="tile"><span class="lab">OP z mesiaca → objednávka</span><span class="val">${conv} %</span><span class="s">${co.filter(o => o.rs >= 3).length} z ${nCo} zaevidovaných</span></div>`;
  mkChart(document.getElementById('teamCh'), all, ym, false);
  // summary table
  const by = D.owners.map((nm,i) => { const ops = all.filter(o => o.o === i); return {nm, i, ops, c: Object.fromEntries(['n','po','ak','ob','fa','w','l'].map(k => [k, cnt(ops,ym,k)])),
    open: ops.filter(o => o.n.slice(0,7) === ym && (o.ss === 'open' || o.ss === 'post')).length}; });
  by.sort((a,b) => b.c.n - a.c.n || b.c.po - a.c.po || a.nm.localeCompare(b.nm,'sk'));
  const K = ['n','po','ak','ob','fa','w','l'];
  const cell = n => n ? val(n) : '<span class="z">0</span>';
  document.getElementById('sumTbl').innerHTML = `<thead><tr><th class="l">Predajca</th>${K.map(k => `<th>${EVL[k].replace(' podpísané','').replace(' uhradené','').replace('Ponuky zaslané','Ponuky').replace('Ponuky akceptované','Akcept.').replace('Prehry / zrušené','Prehry')}</th>`).join('')}<th>Otvorené z mes.</th></tr></thead>
    <tbody>${by.map(r => `<tr class="click" tabindex="0" data-i="${r.i}"><td class="l"><b>${esc(r.nm)}</b></td>${K.map(k => `<td>${cell(r.c[k])}</td>`).join('')}<td>${cell(r.open)}</td></tr>`).join('')}</tbody>
    <tfoot><tr><td class="l">Spolu</td>${K.map(k => `<td>${val(cnt(all,ym,k))}</td>`).join('')}<td>${fmt(by.reduce((s,r)=>s+r.open,0))}</td></tr></tfoot>`;
  document.querySelectorAll('#sumTbl tbody tr').forEach(tr => { const go = () => document.getElementById('rep'+tr.dataset.i)?.scrollIntoView({behavior:'smooth', block:'start'});
    tr.onclick = go; tr.onkeydown = e => { if (e.key === 'Enter') go(); }; });
  // rep cards
  document.getElementById('funNote').textContent = st.fun === 'c'
    ? `Lievik: OP zaevidované v mesiaci ${mname} a kam sa do dnešného exportu dostali. Percentá sú z počtu zaevidovaných.`
    : `Lievik: koľko udalostí každého typu nastalo v mesiaci ${mname}, bez ohľadu na to, kedy bol OP zaevidovaný.`;
  const reps = document.getElementById('reps'); reps.innerHTML = '';
  for (const r of by){
    const F = funnel(r.ops, ym);
    const list = r.ops.filter(o => K.some(k => o[k] && o[k].slice(0,7) === ym)).sort((a,b) => (b.n > a.n) - (b.n < a.n));
    const el = document.createElement('article'); el.className = 'card rep'; el.id = 'rep' + r.i;
    el.innerHTML = `<div class="hd"><span class="nm">${esc(r.nm)}</span><div class="kp">
        <span class="pill">Nové <b>${val(r.c.n)}</b></span><span class="pill">Ponuky <b>${val(r.c.po)}</b></span><span class="pill">Objednávky <b>${val(r.c.ob)}</b></span><span class="pill">Výhry <b>${val(r.c.w)}</b></span></div></div>
      ${funHtml(F)}${F.extra ? `<span class="note">${F.extra}</span>` : ''}
      <div class="chartbox sm"><canvas aria-label="Denný výkon ${esc(r.nm)}"></canvas></div>
      ${list.length ? `<details class="ops"><summary>OP s udalosťou v mesiaci (${list.length})</summary><div class="tbl"><table><thead><tr><th class="l">Kód</th><th class="l">Model</th><th class="l">Značka</th><th>Zaevid.</th><th>Ponuka</th><th>Objedn.</th><th class="l">Stav</th><th>Hodnota €</th></tr></thead><tbody>
        ${list.map(o => { const [s,c] = STL(o); const e = o.e || []; return `<tr><td class="l">${esc(o.k)}</td><td class="l">${esc(o.m || '—')}</td><td class="l">${esc(D.brands[o.b])}</td><td>${dm(o.n)}</td><td>${o.po ? (e.includes('po') ? '≈' : '') + dm(o.po) : '—'}</td><td>${o.ob ? (e.includes('ob') ? '≈' : '') + dm(o.ob) : '—'}</td><td class="l"><span class="st ${c}">${esc(s)}</span></td><td>${o.v ? fmt(o.v) : '—'}</td></tr>`; }).join('')}
        </tbody></table></div></details>` : '<div class="empty">V tomto mesiaci bez udalostí.</div>'}`;
    reps.appendChild(el);
    mkChart(el.querySelector('canvas'), r.ops, ym, true);
  }
  document.getElementById('foot').textContent = `Zdroj: export RAYNET „Obchodné prípady – výber“ ${D.exported}, typ obchodu Predaj MV. Dátum zaevidovania, podpisu objednávky, úhrady faktúry a uzavretia (výhra/prehra) je priamo z RAYNET. Dátum odoslania a akceptácie ponuky RAYNET neexportuje: od ${dm(D.firstRun)} ${D.firstRun.slice(0,4)} sa zisťuje z denných exportov (deň zmeny stavu), staršie sú odhadnuté z dátumu poslednej zmeny stavu alebo zaevidovania a v zozname sú označené „≈“. Mená klientov sa na tejto stránke nezobrazujú.`;
}

mSel.onchange = () => { st.ym = mSel.value; render(); };
document.getElementById('metSeg').onclick = e => { const b = e.target.closest('button'); if (!b) return; st.met = b.dataset.m; save(); render(); };
document.getElementById('funSeg').onclick = e => { const b = e.target.closest('button'); if (!b) return; st.fun = b.dataset.f; save(); render(); };
document.getElementById('cum').onchange = e => { st.cum = e.target.checked; save(); render(); };
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', render);
new MutationObserver(render).observe(document.documentElement, {attributes:true, attributeFilter:['data-theme']});
render();
</script>
</body></html>
